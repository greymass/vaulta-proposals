name: CI
on:
    push:
        branches: [master]
    pull_request:
permissions:
    contents: read
jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun test test/
            - run: bun run verify
            - run: bun scripts/build-index.ts --check
